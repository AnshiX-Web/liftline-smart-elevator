<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101b2c">
    <title>Liftline — Campus Lift Directory</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #172437;
            --muted: #78869a;
            --line: #e8edf2;
            --canvas: #f5f7fa;
            --panel: #fff;
            --navy: #101b2c;
            --navy-soft: #1b2b40;
            --teal: #17a996;
            --teal-soft: #e3f6f2;
            --red: #df5360;
            --red-soft: #fff0f1;
            --amber: #d78a28;
            --amber-soft: #fff5e6;
            --blue: #537fca;
            --blue-soft: #edf3ff;
            --shadow: 0 8px 26px rgba(24, 42, 63, .055);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        * { box-sizing: border-box; }
        body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); }
        button, input, select { font: inherit; }
        button { cursor: pointer; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        .icon { width: 19px; height: 19px; flex: 0 0 auto; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
        .app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
        .sidebar { display: flex; flex-direction: column; min-height: 100vh; padding: 25px 16px 18px; color: #dce5ef; background: var(--navy); }
        .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 29px; }
        .brand-mark { display: grid; place-items: center; width: 37px; height: 37px; color: #fff; background: var(--teal); border-radius: 12px; }
        .brand-mark .icon { width: 21px; height: 21px; }
        .brand-name { color: white; font-size: 15px; font-weight: 750; letter-spacing: -.3px; }
        .brand-caption { margin-top: 2px; color: #8492a5; font-size: 10px; letter-spacing: 1.15px; text-transform: uppercase; }
        .workspace-label { padding: 0 12px 9px; color: #718198; font-size: 10px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
        .nav-list { display: grid; gap: 5px; }
        .nav-button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 12px; color: #9eacbd; background: transparent; border: 0; border-radius: 9px; text-align: left; font-size: 13px; transition: background .16s ease, color .16s ease; }
        .nav-button:hover { color: white; background: rgba(255,255,255,.07); }
        .nav-button.active { color: #fff; background: #23364a; box-shadow: inset 3px 0 var(--teal); }
        .nav-button.active .icon { color: #53d2bf; }
        .nav-count { margin-left: auto; min-width: 21px; padding: 2px 6px; color: #fff; background: #b94a59; border-radius: 20px; text-align: center; font-size: 10px; font-weight: 700; }
        .sidebar-bottom { margin-top: auto; }
        .support-card { padding: 13px; margin: 0 3px 17px; color: #c6d1de; background: #19293c; border: 1px solid #2a3a4d; border-radius: 11px; }
        .support-card strong { display: block; margin-bottom: 5px; color: #f5f7fb; font-size: 12px; }
        .support-card p { margin: 0; color: #9cacbf; font-size: 11px; line-height: 1.55; }
        .sidebar-user { display: flex; align-items: center; gap: 10px; padding: 15px 9px 0; border-top: 1px solid #29384a; }
        .avatar { display: grid; place-items: center; width: 34px; height: 34px; color: #146f64; background: #d9f3ee; border-radius: 50%; font-size: 11px; font-weight: 800; }
        .user-name { color: #f1f5f9; font-size: 12px; font-weight: 650; }
        .user-role { margin-top: 3px; color: #93a2b5; font-size: 10px; }
        .main-area { min-width: 0; }
        .topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; min-height: 73px; padding: 0 36px; background: rgba(255,255,255,.9); border-bottom: 1px solid var(--line); }
        .crumb { color: var(--muted); font-size: 12px; }
        .crumb strong { color: var(--ink); font-weight: 650; }
        .topbar-actions { display: flex; align-items: center; gap: 15px; }
        .building-select { padding: 8px 29px 8px 11px; color: #46566a; background: white; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; }
        .icon-button { position: relative; display: grid; place-items: center; width: 36px; height: 36px; color: #66778d; background: white; border: 1px solid var(--line); border-radius: 9px; }
        .icon-button .dot { position: absolute; top: 7px; right: 7px; width: 6px; height: 6px; background: var(--red); border: 1px solid white; border-radius: 50%; }
        .storage-indicator { display: inline-flex; align-items: center; gap: 6px; padding: 6px 9px; color: #168976; background: var(--teal-soft); border-radius: 20px; font-size: 9px; font-weight: 750; white-space: nowrap; }
        .storage-indicator::before { width: 6px; height: 6px; background: currentColor; border-radius: 50%; content: ""; }
        .storage-indicator.local { color: #9c6a1e; background: var(--amber-soft); }
        .mobile-brand { display: none; align-items: center; gap: 9px; color: var(--ink); font-size: 14px; font-weight: 750; }
        .content { width: min(1470px, 100%); padding: 31px 36px 48px; margin: 0 auto; }
        .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
        .eyebrow { margin-bottom: 7px; color: var(--teal); font-size: 10px; font-weight: 800; letter-spacing: 1.45px; text-transform: uppercase; }
        h1 { margin: 0; color: var(--ink); font-size: clamp(24px, 2.5vw, 29px); line-height: 1.2; letter-spacing: -.8px; }
        .page-subtitle { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
        .button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; padding: 0 14px; color: #405168; background: #fff; border: 1px solid var(--line); border-radius: 8px; font-size: 12px; font-weight: 650; transition: transform .12s, background .12s; }
        .button:hover { background: #f8fafc; transform: translateY(-1px); }
        .button .icon { width: 16px; height: 16px; }
        .button-primary { color: white; background: var(--teal); border-color: var(--teal); }
        .button-primary:hover { background: #128e7e; }
        .button-danger { color: white; background: var(--red); border-color: var(--red); }
        .button-danger:hover { background: #c84755; }
        .button-small { min-height: 30px; padding: 0 10px; font-size: 11px; }
        .hero { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 165px; padding: 27px 31px; overflow: hidden; color: white; background: linear-gradient(110deg, #14253a, #1d3948); border-radius: 14px; box-shadow: var(--shadow); }
        .hero::after { position: absolute; top: -105px; right: 92px; width: 300px; height: 300px; border: 1px solid rgba(105,220,204,.16); border-radius: 50%; content: ""; box-shadow: 0 0 0 34px rgba(105,220,204,.045), 0 0 0 70px rgba(105,220,204,.035); }
        .hero-copy { position: relative; z-index: 1; max-width: 550px; }
        .hero-kicker { margin-bottom: 9px; color: #84dfd0; font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
        .hero h2 { margin: 0; color: white; font-size: 22px; letter-spacing: -.45px; }
        .hero p { margin: 8px 0 0; color: #b8c8d3; font-size: 12px; line-height: 1.55; }
        .hero-status { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; min-width: 178px; padding: 13px 15px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.13); border-radius: 10px; }
        .pulse { width: 8px; height: 8px; background: #4ed1aa; border-radius: 50%; box-shadow: 0 0 0 5px rgba(78,209,170,.15); }
        .hero-status strong { display: block; color: white; font-size: 11px; }
        .hero-status span:last-child { display: block; margin-top: 3px; color: #adc1ce; font-size: 10px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin: 17px 0; }
        .stat-card, .panel, .lift-card, .team-card, .maintenance-card, .role-card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow); }
        .stat-card { min-height: 118px; padding: 17px 18px; }
        .stat-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 11px; font-weight: 600; }
        .stat-icon { display: grid; place-items: center; width: 30px; height: 30px; color: var(--teal); background: var(--teal-soft); border-radius: 9px; }
        .stat-icon .icon { width: 16px; height: 16px; }
        .stat-icon.red { color: var(--red); background: var(--red-soft); }
        .stat-icon.amber { color: var(--amber); background: var(--amber-soft); }
        .stat-icon.blue { color: var(--blue); background: var(--blue-soft); }
        .stat-value { margin-top: 10px; color: var(--ink); font-size: 25px; font-weight: 750; letter-spacing: -.8px; }
        .stat-foot { margin-top: 4px; color: #98a3b2; font-size: 10px; }
        .positive { color: #15917f; font-weight: 650; }
        .dashboard-grid { display: grid; grid-template-columns: minmax(0,1.7fr) minmax(260px,.9fr); gap: 16px; align-items: start; }
        .panel { min-width: 0; padding: 18px; }
        .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
        .panel-heading h3 { margin: 0; color: var(--ink); font-size: 14px; letter-spacing: -.2px; }
        .panel-heading p { margin: 5px 0 0; color: var(--muted); font-size: 10px; }
        .text-link { padding: 4px 0; color: #118f81; background: transparent; border: 0; font-size: 11px; font-weight: 700; }
        .table-wrap { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 9px 9px; color: #91a0b0; border-bottom: 1px solid var(--line); font-size: 9px; font-weight: 750; letter-spacing: .75px; text-transform: uppercase; white-space: nowrap; }
        td { padding: 12px 9px; color: #5e6c7f; border-bottom: 1px solid #f0f3f6; font-size: 11px; white-space: nowrap; }
        tr:last-child td { border-bottom: 0; }
        .cell-strong { color: #27364a; font-weight: 700; }
        .cell-sub { margin-top: 3px; color: #9aa6b4; font-size: 10px; }
        .status { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 20px; font-size: 9px; font-weight: 750; }
        .status::before { width: 5px; height: 5px; background: currentColor; border-radius: 50%; content: ""; }
        .status-received { color: #bd4d59; background: var(--red-soft); }
        .status-acknowledged { color: #ab6e1d; background: var(--amber-soft); }
        .status-dispatched { color: #4e74b4; background: var(--blue-soft); }
        .status-resolved { color: #168976; background: var(--teal-soft); }
        .empty-state { padding: 28px 15px; color: #8a97a7; text-align: center; font-size: 12px; line-height: 1.6; }
        .empty-state strong { display: block; margin-bottom: 4px; color: #4d5d70; font-size: 12px; }
        .fleet-list { display: grid; gap: 11px; }
        .fleet-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 11px; background: #fafbfd; border: 1px solid #eef2f5; border-radius: 9px; }
        .fleet-left { display: flex; align-items: center; gap: 10px; }
        .lift-icon { display: grid; place-items: center; width: 31px; height: 31px; color: #5779b3; background: #edf3ff; border-radius: 8px; }
        .lift-icon .icon { width: 16px; height: 16px; }
        .fleet-title { color: #334258; font-size: 11px; font-weight: 700; }
        .fleet-detail { margin-top: 3px; color: #97a2af; font-size: 9px; }
        .online { color: #168976; font-size: 9px; font-weight: 700; }
        .online::before { display: inline-block; width: 6px; height: 6px; margin-right: 5px; background: #22b394; border-radius: 50%; content: ""; }
        .content-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 15px; }
        .lift-card, .team-card, .maintenance-card, .role-card { padding: 18px; }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
        .card-title { color: #29394e; font-size: 13px; font-weight: 750; }
        .card-description { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
        .card-meta { display: flex; flex-wrap: wrap; gap: 14px; margin: 17px 0; color: #728196; font-size: 10px; }
        .card-actions { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 13px; border-top: 1px solid #eff2f5; }
        .progress-bar { height: 6px; margin-top: 9px; overflow: hidden; background: #edf1f4; border-radius: 10px; }
        .progress-bar span { display: block; height: 100%; background: var(--teal); border-radius: inherit; }
        .person-row { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
        .person-row .avatar { width: 30px; height: 30px; color: #526ca4; background: #eaf0fb; }
        .tag { display: inline-block; padding: 4px 7px; color: #64758a; background: #f0f3f6; border-radius: 5px; font-size: 9px; font-weight: 700; }
        .status-strip { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; padding: 11px 13px; margin-bottom: 17px; color: #5b6d7f; background: #fff; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; }
        .status-strip .pulse { width: 7px; height: 7px; }
        .sos-layout { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(290px,.9fr); gap: 17px; align-items: start; }
        .warning-panel { padding: 13px; margin: 15px 0 2px; color: #82591d; background: var(--amber-soft); border: 1px solid #f1ddb9; border-radius: 9px; font-size: 10px; line-height: 1.55; }
        .warning-panel strong, .warning-panel span { display: block; }
        .warning-panel strong { margin-bottom: 4px; color: #744c12; }
        .button:disabled { cursor: not-allowed; opacity: .58; transform: none; }
        .sos-card { padding: 23px; }
        .sos-card h2 { margin: 0; color: var(--ink); font-size: 17px; }
        .sos-card > p { margin: 6px 0 19px; color: var(--muted); font-size: 11px; line-height: 1.6; }
        .location-box { display: flex; align-items: flex-start; gap: 11px; padding: 13px; margin-bottom: 19px; background: #f7f9fb; border: 1px solid #e8edf2; border-radius: 9px; }
        .location-box .icon { color: var(--teal); }
        .location-box strong { display: block; color: #314155; font-size: 11px; }
        .location-box span { display: block; margin-top: 4px; color: #8290a1; font-size: 10px; }
        .field-label { display: block; margin: 0 0 8px; color: #536378; font-size: 10px; font-weight: 750; letter-spacing: .3px; }
        .radio-list { display: grid; gap: 8px; }
        .radio-option { display: flex; align-items: center; gap: 9px; padding: 11px; color: #47586d; border: 1px solid #e8edf2; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .radio-option:has(input:checked) { background: #fff8f8; border-color: #efb9bf; }
        .radio-option input { accent-color: var(--red); }
        .sos-button { width: 100%; min-height: 45px; margin-top: 17px; border-radius: 9px; font-size: 11px; font-weight: 800; letter-spacing: .3px; }
        .fine-print { margin-top: 10px !important; color: #98a4b1 !important; font-size: 9px !important; text-align: center; }
        .tracking-card { padding: 22px; }
        .tracking-heading { display: flex; align-items: center; gap: 10px; }
        .tracking-check { display: grid; place-items: center; width: 34px; height: 34px; color: #168976; background: var(--teal-soft); border-radius: 50%; font-size: 18px; font-weight: 800; }
        .tracking-heading h3 { margin: 0; color: #2b3a4d; font-size: 13px; }
        .tracking-heading p { margin: 4px 0 0; color: #8794a2; font-size: 10px; }
        .tracking-id { padding: 12px; margin: 17px 0; background: #f7f9fb; border: 1px solid var(--line); border-radius: 8px; }
        .tracking-id span { display: block; color: #9aa6b4; font-size: 9px; font-weight: 750; letter-spacing: .8px; }
        .tracking-id strong { display: block; margin-top: 5px; color: #324258; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; }
        .timeline { display: grid; gap: 0; margin-top: 18px; }
        .timeline-item { position: relative; min-height: 48px; padding: 0 0 16px 24px; border-left: 1px solid #dfe6eb; }
        .timeline-item:last-child { min-height: 26px; border-color: transparent; }
        .timeline-dot { position: absolute; top: 1px; left: -5px; width: 9px; height: 9px; background: #dce3e9; border: 2px solid white; border-radius: 50%; box-shadow: 0 0 0 1px #dce3e9; }
        .timeline-item.done .timeline-dot { background: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
        .timeline-item strong { display: block; color: #536276; font-size: 10px; }
        .timeline-item span { display: block; margin-top: 4px; color: #97a3b0; font-size: 9px; }
        .toast { position: fixed; right: 22px; bottom: 22px; z-index: 20; max-width: min(380px, calc(100vw - 32px)); padding: 13px 16px; color: white; background: #22354a; border-radius: 9px; box-shadow: 0 12px 36px rgba(15,27,42,.22); font-size: 12px; }
        .toast.error { background: #b6424e; }
        .toast[hidden] { display: none; }
        .loading { color: #94a0ae; font-size: 11px; }
        @media (max-width: 1100px) {
            .app { grid-template-columns: 220px minmax(0,1fr); }
            .content { padding: 26px 24px 40px; }
            .topbar { padding: 0 24px; }
            .stats-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
        }
        @media (max-width: 820px) {
            .app { display: block; }
            .sidebar { position: sticky; top: 0; z-index: 5; min-height: auto; padding: 10px 14px 0; }
            .brand { display: none; }
            .workspace-label, .sidebar-bottom { display: none; }
            .nav-list { display: flex; gap: 4px; overflow-x: auto; padding: 0 0 8px; scrollbar-width: none; }
            .nav-list::-webkit-scrollbar { display: none; }
            .nav-button { flex: 0 0 auto; width: auto; gap: 7px; padding: 9px 10px; font-size: 11px; white-space: nowrap; }
            .nav-button.active { box-shadow: inset 0 -2px var(--teal); }
            .nav-button .icon { width: 16px; height: 16px; }
            .topbar { min-height: 58px; padding: 0 18px; }
            .mobile-brand { display: flex; }
            .mobile-brand .brand-mark { width: 29px; height: 29px; border-radius: 9px; }
            .mobile-brand .icon { width: 17px; height: 17px; }
            .crumb { display: none; }
            .content { padding: 23px 18px 36px; }
        }
        @media (max-width: 650px) {
            .topbar-actions { gap: 8px; }
            .building-select { max-width: 145px; padding-left: 8px; font-size: 10px; }
            .hero { align-items: flex-start; flex-direction: column; padding: 22px; }
            .hero-status { min-width: 0; }
            .dashboard-grid, .sos-layout { grid-template-columns: 1fr; }
            .content-grid { grid-template-columns: 1fr; }
            .stats-grid { gap: 9px; }
            .stat-card { min-height: 108px; padding: 13px; }
            .stat-value { font-size: 22px; }
            .stat-top { font-size: 10px; }
            .page-heading { align-items: center; }
            .page-heading > .button { flex: 0 0 auto; padding: 0 10px; font-size: 10px; }
            .panel { padding: 14px; }
            .sos-card, .tracking-card { padding: 18px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>

    <div class="app">
        <aside class="sidebar" aria-label="Main navigation">
            <div class="brand">
                <span class="brand-mark"><svg class="icon"><use href="#i-lift"/></svg></span>
                <span><span class="brand-name">liftline</span><span class="brand-caption">Safety operations</span></span>
            </div>
            <div class="workspace-label">Operations</div>
            <nav class="nav-list" id="navigation">
                <button class="nav-button active" data-view="overview"><svg class="icon"><use href="#i-grid"/></svg>Overview</button>
                <button class="nav-button" data-view="incidents"><svg class="icon"><use href="#i-bell"/></svg>Emergencies<span id="nav-count" class="nav-count" hidden>0</span></button>
                <button class="nav-button" data-view="rescue"><svg class="icon"><use href="#i-users"/></svg>Rescue team</button>
                <button class="nav-button" data-view="elevators"><svg class="icon"><use href="#i-lift"/></svg>Elevators</button>
                <button class="nav-button" data-view="maintenance"><svg class="icon"><use href="#i-wrench"/></svg>Maintenance</button>
                <button class="nav-button" data-view="passenger"><svg class="icon"><use href="#i-bolt"/></svg>Emergency info</button>
                <button class="nav-button" data-view="admin"><svg class="icon"><use href="#i-shield"/></svg>Administration</button>
            </nav>
            <div class="sidebar-bottom">
                <div class="support-card"><strong>Safety desk</strong><p>Available around the clock for urgent building response.</p></div>
                <div class="sidebar-user">
                    <span class="avatar">CS</span>
                    <span><span class="user-name">College students</span><span class="user-role">Public campus information</span></span>
                </div>
            </div>
        </aside>

        <div class="main-area">
            <header class="topbar">
                <div class="mobile-brand"><span class="brand-mark"><svg class="icon"><use href="#i-lift"/></svg></span>liftline</div>
                <div class="crumb">Workspace <span aria-hidden="true">/</span> <strong id="breadcrumb">Overview</strong></div>
                <div class="topbar-actions">
                    <label class="sr-only" for="building-select">Select building</label>
                    <select class="building-select" id="building-select" aria-label="Filter by building">
                        <option value="all">All buildings</option>
                    </select>
                    <span id="storage-mode" class="storage-indicator" hidden></span>
                    <button class="icon-button" id="notification-button" type="button" aria-label="View emergencies"><svg class="icon"><use href="#i-bell"/></svg><span class="dot"></span></button>
                </div>
            </header>
            <main class="content" id="content" tabindex="-1" aria-live="polite">
                <p class="loading">Loading safety operations…</p>
            </main>
        </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script>
        const state = {
            view: "overview",
            alerts: [],
            currentAlert: null,
            inventory: null,
            buildingFilter: "all",
            selectedBuildingId: "",
            selectedLiftId: "",
            storageMode: "checking",
            toastTimer: null
        };
        const viewTitles = {
            overview: "Overview", incidents: "Emergencies", rescue: "Rescue team",
            elevators: "Elevators", maintenance: "Maintenance", passenger: "Emergency info",
            admin: "Administration"
        };
        const content = document.getElementById("content");

        function escapeHtml(value) {
            return String(value ?? "").replace(/[&<>"']/g, (char) => ({
                "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
            })[char]);
        }
        function icon(name) {
            return `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
        }
        function allBuildings() {
            return state.inventory?.buildings || [];
        }
        function visibleBuildings() {
            return state.buildingFilter === "all"
                ? allBuildings()
                : allBuildings().filter((building) => building.id === state.buildingFilter);
        }
        function visibleLifts() {
            return visibleBuildings().flatMap((building) =>
                (building.lifts || []).map((lift) => ({ ...lift, buildingName: building.name, buildingId: building.id })));
        }
        function selectedBuilding() {
            return allBuildings().find((building) => building.id === state.selectedBuildingId) || allBuildings()[0];
        }
        function selectedLift() {
            const building = selectedBuilding();
            return building?.lifts?.find((lift) => lift.id === state.selectedLiftId) || building?.lifts?.[0];
        }
        function updateBuildingOptions() {
            const select = document.getElementById("building-select");
            const selected = state.buildingFilter;
            select.innerHTML = `<option value="all">All buildings</option>${allBuildings().map((building) => `<option value="${escapeHtml(building.id)}">${escapeHtml(building.name)}</option>`).join("")}`;
            select.value = allBuildings().some((building) => building.id === selected) ? selected : "all";
        }
        function showToast(message, isError) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.classList.toggle("error", Boolean(isError));
            toast.hidden = false;
            window.clearTimeout(state.toastTimer);
            state.toastTimer = window.setTimeout(() => { toast.hidden = true; }, 4200);
        }
        async function api(path, options) {
            const response = await fetch(path, {
                headers: { "Content-Type": "application/json" },
                ...options
            });
            let result;
            try {
                result = await response.json();
            } catch {
                throw new Error("The safety service returned an unreadable response.");
            }
            if (!response.ok || result.success === false) {
                throw new Error(result.error || `The safety service returned ${response.status}.`);
            }
            return result;
        }
        async function refreshAlerts() {
            if (state.storageMode !== "live") throw new Error("Shared emergency alerts are not connected.");
            const result = await api("/api/sos");
            state.alerts = Array.isArray(result) ? result : result.alerts;
            if (!Array.isArray(state.alerts)) throw new Error("The safety service returned an invalid emergency list.");
            updateNavCount();
            render();
        }
        function updateStorageIndicator() {
            const indicator = document.getElementById("storage-mode");
            if (state.storageMode === "checking") {
                indicator.hidden = true;
                return;
            }
            const alertsAreLive = state.storageMode === "live" && state.inventory?.emergencyChannelConfigured === true;
            indicator.textContent = alertsAreLive ? "Live response configured" : "Inventory only · alerts off";
            indicator.classList.toggle("local", !alertsAreLive);
            indicator.hidden = false;
        }
        function updateNavCount() {
            const badge = document.getElementById("nav-count");
            const count = state.alerts.filter((alert) => alert.status !== "Resolved").length;
            document.querySelector(".icon-button .dot").hidden = state.storageMode !== "live";
            badge.textContent = count;
            badge.hidden = state.storageMode !== "live" || count === 0;
        }
        function statusClass(status) {
            if (status === "Acknowledged") return "status-acknowledged";
            if (status === "Rescue dispatched") return "status-dispatched";
            if (status === "Resolved") return "status-resolved";
            return "status-received";
        }
        function statusBadge(status) {
            return `<span class="status ${statusClass(status)}">${escapeHtml(status || "Received")}</span>`;
        }
        function timestamp(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? "Just now" : date.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        }
        function alertRows(items) {
            if (!items.length) {
                const message = state.storageMode === "live"
                    ? ["No emergency alerts recorded", "Submitted alerts will appear here."]
                    : ["Shared alerts are not connected", "This site cannot receive or monitor campus emergency calls yet."];
                return `<tr><td colspan="5"><div class="empty-state"><strong>${message[0]}</strong>${message[1]}</div></td></tr>`;
            }
            return items.map((alert) => `<tr>
                <td><span class="cell-strong">${escapeHtml(alert.emergencyId || alert.EmergencyId)}</span><div class="cell-sub">${escapeHtml(timestamp(alert.submittedAt || alert.SubmittedAt))}</div></td>
                <td><span class="cell-strong">${escapeHtml(alert.elevatorId || alert.ElevatorId)}</span><div class="cell-sub">${escapeHtml(alert.location)}</div></td>
                <td>${escapeHtml(alert.passengerName || alert.PassengerName)}</td>
                <td>${statusBadge(alert.status || "Received")}</td>
                <td>${actionButton(alert)}</td>
            </tr>`).join("");
        }
        function actionButton(alert) {
            const status = alert.status || "Received";
            const next = status === "Received" ? "Acknowledged" : status === "Acknowledged" ? "Rescue dispatched" : status === "Rescue dispatched" ? "Resolved" : "";
            if (!next) return `<span class="cell-sub">Closed</span>`;
            const label = next === "Rescue dispatched" ? "Dispatch" : next === "Resolved" ? "Resolve" : "Acknowledge";
            return `<button class="button button-small" type="button" data-alert-action="${escapeHtml(alert.emergencyId || alert.EmergencyId)}" data-next-status="${escapeHtml(next)}">${label}</button>`;
        }
        function pageHeading(eyebrow, title, subtitle, action) {
            return `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="page-subtitle">${subtitle}</p></div>${action || ""}</div>`;
        }
        function renderOverview() {
            const buildings = visibleBuildings();
            const lifts = visibleLifts();
            const floorCount = lifts.reduce((total, lift) => total + Number(lift.floorsServed || 0), 0);
            const activeCount = state.storageMode === "live"
                ? state.alerts.filter((alert) => alert.status !== "Resolved").length
                : "—";
            const today = new Date().toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }).toUpperCase();
            return `${pageHeading(today, "Campus lift safety", `Inventory supplied for ${buildings.length} building${buildings.length === 1 ? "" : "s"}.`, `<button class="button" type="button" data-go="passenger">${icon("pin")} Emergency information</button>`)}
                <section class="hero" aria-label="Building status">
                    <div class="hero-copy"><div class="hero-kicker">${escapeHtml(state.inventory.collegeName)} · Lift directory</div><h2>Campus lift information</h2><p>Building and lift details provided for student reference. Lift condition and live telemetry are not connected.</p></div>
                    <div class="hero-status"><span class="pulse" style="background:#e5b24e;box-shadow:0 0 0 5px rgba(229,178,78,.15)"></span><span><strong>Inventory only</strong><span>Emergency alerts are not monitored</span></span></div>
                </section>
                <section class="stats-grid" aria-label="Campus lift information">
                    <article class="stat-card"><div class="stat-top">Active emergency alerts<span class="stat-icon red">${icon("bell")}</span></div><div class="stat-value">${activeCount}</div><div class="stat-foot">${state.storageMode === "live" ? "From shared alert feed" : "Shared alert feed not connected"}</div></article>
                    <article class="stat-card"><div class="stat-top">Lifts in inventory<span class="stat-icon">${icon("lift")}</span></div><div class="stat-value">${lifts.length}</div><div class="stat-foot">Across ${buildings.length} listed building${buildings.length === 1 ? "" : "s"}</div></article>
                    <article class="stat-card"><div class="stat-top">Floors represented<span class="stat-icon blue">${icon("grid")}</span></div><div class="stat-value">${floorCount}</div><div class="stat-foot">Floor count as supplied</div></article>
                    <article class="stat-card"><div class="stat-top">Emergency routing<span class="stat-icon amber">${icon("shield")}</span></div><div class="stat-value" style="font-size:19px">Not set up</div><div class="stat-foot">No monitored campus contact configured</div></article>
                </section>
                <section class="dashboard-grid">
                    <article class="panel"><div class="panel-heading"><div><h3>Emergency alerts</h3><p>Shared response queue status</p></div><button class="text-link" type="button" data-go="incidents">View details →</button></div>
                        <div class="table-wrap"><table><thead><tr><th>Alert</th><th>Elevator &amp; location</th><th>Passenger</th><th>Status</th><th>Action</th></tr></thead><tbody>${alertRows(state.alerts.slice(0, 5))}</tbody></table></div>
                    </article>
                    <article class="panel"><div class="panel-heading"><div><h3>College lift directory</h3><p>${lifts.length} listed · operational state unknown</p></div><button class="text-link" type="button" data-go="elevators">View lifts →</button></div>
                        <div class="fleet-list">${lifts.map((lift) => `<div class="fleet-row"><div class="fleet-left"><span class="lift-icon">${icon("lift")}</span><span><span class="fleet-title">${escapeHtml(lift.id)} · ${escapeHtml(lift.buildingName)}</span><span class="fleet-detail">${Number(lift.floorsServed) || 0} floors listed</span></span></div><span class="tag">Not connected</span></div>`).join("")}</div>
                    </article>
                </section>`;
        }
        function renderIncidents() {
            return `${pageHeading("EMERGENCY RESPONSE", "Emergency alerts", "The shared alert feed is unavailable until a campus response service is connected.", `<button class="button" type="button" data-go="passenger">Emergency information</button>`)}
                <div class="status-strip"><span class="tag">Not connected</span><strong>Alerts are not monitored</strong><span>·</span><span>Do not rely on this website to request rescue.</span></div>
                <section class="panel"><div class="panel-heading"><div><h3>All emergency alerts</h3><p>${state.alerts.length} recorded alert${state.alerts.length === 1 ? "" : "s"}</p></div><button class="button button-small" type="button" data-refresh>Refresh</button></div>
                <div class="table-wrap"><table><thead><tr><th>Alert ID</th><th>Elevator &amp; location</th><th>Passenger</th><th>Incident</th><th>Status</th><th>Next step</th></tr></thead><tbody>${state.alerts.length ? state.alerts.map((alert) => `<tr>
                    <td><span class="cell-strong">${escapeHtml(alert.emergencyId || alert.EmergencyId)}</span><div class="cell-sub">${escapeHtml(timestamp(alert.submittedAt || alert.SubmittedAt))}</div></td>
                    <td><span class="cell-strong">${escapeHtml(alert.elevatorId || alert.ElevatorId)}</span><div class="cell-sub">${escapeHtml(alert.location)}</div></td>
                    <td>${escapeHtml(alert.passengerName || alert.PassengerName)}</td><td>${escapeHtml(alert.category)}</td>
                    <td>${statusBadge(alert.status || "Received")}</td><td>${actionButton(alert)}</td>
                </tr>`).join("") : `<tr><td colspan="6"><div class="empty-state"><strong>No shared alert feed</strong>This public website cannot receive or monitor emergency calls.</div></td></tr>`}</tbody></table></div></section>`;
        }
        function renderRescue() {
            return `${pageHeading("CAMPUS RESPONSE", "Response team", "No campus rescue roster has been provided or connected.")}
                <section class="panel"><div class="empty-state"><strong>Responder contacts are not configured</strong>Students must use the college’s existing security or emergency process. This site does not notify staff.</div></section>`;
        }
        function renderElevators() {
            const lifts = visibleLifts();
            return `${pageHeading("COLLEGE DIRECTORY", "Elevators", "Lift identifiers and floor counts supplied for student reference. Live condition and telemetry are not connected.")}
                <div class="status-strip"><span class="tag">Inventory only</span><strong>${lifts.length} listed lift${lifts.length === 1 ? "" : "s"}</strong><span>·</span><span>Condition has not been verified by this website</span></div>
                <div class="content-grid">${lifts.map((lift) => `<article class="lift-card"><div class="card-top"><div><div class="card-title">${escapeHtml(lift.id)}</div><div class="card-description">${escapeHtml(lift.buildingName)}</div></div><span class="tag">Status unknown</span></div><div class="card-meta"><span>Floors served <strong>${Number(lift.floorsServed) || 0}</strong></span><span>Location detail <strong>Not provided</strong></span></div><div class="card-actions"><button class="button button-small" type="button" data-go="passenger">Emergency information</button></div></article>`).join("")}</div>`;
        }
        function renderMaintenance() {
            return `${pageHeading("EQUIPMENT CARE", "Maintenance", "Maintenance records and inspection schedules have not been provided.")}
                <section class="panel"><div class="empty-state"><strong>No maintenance data connected</strong>Lift status and service history are unknown. Contact the college facilities team to verify equipment condition.</div></section>`;
        }
        function renderAdmin() {
            const liftCount = allBuildings().reduce((total, building) => total + (building.lifts || []).length, 0);
            return `${pageHeading("CAMPUS SETTINGS", "Administration", "Campus lift inventory and emergency service configuration.")}
                <div class="stats-grid"><article class="stat-card"><div class="stat-top">Buildings listed<span class="stat-icon blue">${icon("lift")}</span></div><div class="stat-value">${allBuildings().length}</div><div class="stat-foot">Inventory supplied by the college</div></article><article class="stat-card"><div class="stat-top">Lifts listed<span class="stat-icon">${icon("lift")}</span></div><div class="stat-value">${liftCount}</div><div class="stat-foot">No live status connection</div></article></div>
                <section class="panel"><div class="panel-heading"><div><h3>Emergency response setup</h3><p>Requirements before students can rely on this service</p></div></div><div class="fleet-list"><div class="fleet-row"><span class="fleet-title">Verified campus security contact</span><span class="tag">Not provided</span></div><div class="fleet-row"><span class="fleet-title">Shared alert database</span><span class="tag">Not connected</span></div><div class="fleet-row"><span class="fleet-title">Responder roster and monitoring hours</span><span class="tag">Not configured</span></div></div></section>`;
        }
        function renderPassenger() {
            const building = selectedBuilding();
            const lift = selectedLift();
            const options = building?.lifts || [];
            return `${pageHeading("CAMPUS EMERGENCY INFORMATION", "Need help with a lift?", "This website is not connected to campus responders and cannot send an emergency alert.")}
                <div class="sos-layout">
                    <section class="panel sos-card">
                        <h2>Find the lift</h2>
                        <p>Use this directory to identify the building and lift for campus staff.</p>
                        <label class="field-label" for="report-building">Building</label>
                        <select id="report-building" class="building-select" style="width:100%;margin-bottom:13px">
                            ${allBuildings().map((item) => `<option value="${escapeHtml(item.id)}" ${item.id === building?.id ? "selected" : ""}>${escapeHtml(item.name)}</option>`).join("")}
                        </select>
                        <label class="field-label" for="report-lift">Lift</label>
                        <select id="report-lift" class="building-select" style="width:100%;margin-bottom:13px">
                            ${options.map((item) => `<option value="${escapeHtml(item.id)}" ${item.id === lift?.id ? "selected" : ""}>${escapeHtml(item.id)}</option>`).join("")}
                        </select>
                        <div class="location-box">${icon("pin")}<span><strong>${escapeHtml(building?.name || "Building not selected")} · ${escapeHtml(lift?.id || "Lift not selected")}</strong><span>${Number(lift?.floorsServed) || 0} floors listed · Exact floor labels and lift condition not provided</span></span></div>
                        <div class="warning-panel" role="alert"><strong>Emergency reporting is not available on this site.</strong><span>If someone is trapped or in immediate danger, use the college’s established security procedure or your local emergency number. Do not wait for this website to send help.</span></div>
                        <button id="submit-sos" class="button button-danger sos-button" type="button" disabled>EMERGENCY ALERTING NOT CONFIGURED</button>
                        <p class="fine-print">No alert is sent or monitored by this page.</p>
                    </section>
                    <article class="panel tracking-card"><div class="tracking-heading"><span class="tracking-check" style="color:#a76b1e;background:var(--amber-soft)">${icon("shield")}</span><span><h3>Before student use</h3><p>A verified response path is required.</p></span></div><div class="timeline"><div class="timeline-item done"><span class="timeline-dot"></span><strong>Lift directory loaded</strong><span>Campus building data</span></div><div class="timeline-item"><span class="timeline-dot"></span><strong>Staffed campus contact</strong><span>Not provided</span></div><div class="timeline-item"><span class="timeline-dot"></span><strong>Shared monitored alert service</strong><span>Not connected</span></div></div></article>
                </div>`;
        }
        function render() {
            document.getElementById("breadcrumb").textContent = viewTitles[state.view];
            updateBuildingOptions();
            updateStorageIndicator();
            document.querySelectorAll(".nav-button").forEach((button) => button.classList.toggle("active", button.dataset.view === state.view));
            const pages = { overview: renderOverview, incidents: renderIncidents, rescue: renderRescue, elevators: renderElevators, maintenance: renderMaintenance, passenger: renderPassenger, admin: renderAdmin };
            content.innerHTML = pages[state.view]();
        }
        function navigate(view) {
            if (!viewTitles[view]) return;
            state.view = view;
            render();
            content.focus({ preventScroll: true });
            window.scrollTo({ top: 0, behavior: "smooth" });
        }
        async function updateAlertStatus(id, status) {
            try {
                if (state.storageMode !== "live") throw new Error("Shared emergency response is not connected.");
                await api(`/api/sos/${encodeURIComponent(id)}/status`, {
                    method: "POST",
                    body: JSON.stringify({ status })
                });
                await refreshAlerts();
                if (state.currentAlert && (state.currentAlert.emergencyId || state.currentAlert.EmergencyId) === id) {
                    state.currentAlert = state.alerts.find((alert) => (alert.emergencyId || alert.EmergencyId) === id) || state.currentAlert;
                }
                render();
                showToast(`Alert ${id} updated to ${status.toLowerCase()}.`);
            } catch (error) {
                showToast(error.message, true);
            }
        }
        document.getElementById("navigation").addEventListener("click", (event) => {
            const button = event.target.closest("[data-view]");
            if (button) navigate(button.dataset.view);
        });
        document.getElementById("notification-button").addEventListener("click", () => navigate("incidents"));
        document.getElementById("building-select").addEventListener("change", (event) => {
            state.buildingFilter = event.target.value;
            render();
        });
        content.addEventListener("change", (event) => {
            if (event.target.id === "report-building") {
                state.selectedBuildingId = event.target.value;
                state.selectedLiftId = selectedBuilding()?.lifts?.[0]?.id || "";
                render();
            } else if (event.target.id === "report-lift") {
                state.selectedLiftId = event.target.value;
                render();
            }
        });
        content.addEventListener("click", async (event) => {
            const go = event.target.closest("[data-go]");
            if (go) { navigate(go.dataset.go); return; }
            const action = event.target.closest("[data-alert-action]");
            if (action) { await updateAlertStatus(action.dataset.alertAction, action.dataset.nextStatus); return; }
            const toastButton = event.target.closest("[data-toast]");
            if (toastButton) { showToast(toastButton.dataset.toast); return; }
            if (event.target.closest("[data-refresh]")) {
                try { await refreshAlerts(); showToast("Emergency list refreshed."); }
                catch (error) { showToast(error.message, true); }
                return;
            }
            if (event.target.closest("#submit-sos")) {
                showToast("Emergency alerts are disabled until campus responders and shared monitoring are configured.", true);
            }
        });
        async function loadInventory() {
            const response = await fetch("./college-data.json", { cache: "no-store" });
            if (!response.ok) throw new Error(`Could not load the campus lift directory (${response.status}).`);
            const inventory = await response.json();
            if (!inventory.collegeName || !Array.isArray(inventory.buildings)) {
                throw new Error("The campus lift directory has an invalid format.");
            }
            for (const building of inventory.buildings) {
                if (!building.id || !building.name || !Array.isArray(building.lifts)) {
                    throw new Error("A building entry in the campus lift directory is incomplete.");
                }
            }
            state.inventory = inventory;
            state.selectedBuildingId = inventory.buildings[0]?.id || "";
            state.selectedLiftId = inventory.buildings[0]?.lifts?.[0]?.id || "";
        }
        async function initialize() {
            try {
                await loadInventory();
            } catch (error) {
                content.innerHTML = `<section class="panel"><div class="empty-state"><strong>Campus lift data unavailable</strong>${escapeHtml(error.message)}</div></section>`;
                showToast(error.message, true);
                return;
            }
            try {
                const result = await api("/api/sos");
                const alerts = Array.isArray(result) ? result : result.alerts;
                if (!Array.isArray(alerts)) throw new Error("The safety service returned an invalid emergency list.");
                state.alerts = alerts;
                state.storageMode = "live";
            } catch {
                state.storageMode = "unavailable";
                state.alerts = [];
            }
            updateNavCount();
            render();
            showToast("Campus lift information loaded. Emergency alerts are not connected or monitored.", true);
        }
        initialize();
    </script>
</body>
</html>
